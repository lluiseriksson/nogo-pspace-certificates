[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nogo-pspace-certificates"
version = "1.0.0"
description = "Machine-Checked Exact-Integer Certificates for Normal/Misere Grid NoGo, Coins-are-Lava, and Subcubic Bipartite Graph NoGo PSPACE-Completeness (Burke, Davies, & Tennenhouse, arXiv:2611.33127)"
authors = [{ name = "Lluis Eriksson" }]
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
